# CODEX_QUALITY_HARNESS_FILE v1.3.2
name: v132-compatibility-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  aggregate-contract:
    name: aggregate contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact checkout head and current base
        shell: bash
        env:
          CODEX_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CODEX_EVENT_NAME: ${{ github.event_name }}
          CODEX_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$CODEX_EXPECTED_HEAD_SHA" ]; then
            echo "::error title=v1.3.2 exact-head checkout mismatch::v132_workflow_checkout_head_mismatch"
            exit 1
          fi
          if [[ ! "$CODEX_PR_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || ! git merge-base --is-ancestor "$CODEX_PR_BASE_SHA" HEAD; then
            echo "::error title=v1.3.2 current-base ancestry mismatch::v132_workflow_base_not_ancestor_of_head"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Run bounded compatibility contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/codex-v132-compatibility-check.mjs --lane=immediate-secondary
          node scripts/codex-v132-compatibility-check.mjs --lane=emergency
          node scripts/codex-v132-compatibility-check.mjs --lane=blocking-readable
