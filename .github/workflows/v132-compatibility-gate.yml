# CODEX_QUALITY_HARNESS_FILE v1.3.2
name: v132-compatibility-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "AGENTS.md"
      - "CODEX_SOURCE_HARNESS_MANIFEST.json"
      - "docs/process/CODEX_HARNESS_MANIFEST.json"
      - "docs/process/CODEX_ACTIVE_POLICY_INDEX.json"
      - "docs/process/CODEX_V132_*"
      - "scripts/codex-v132-*.mjs"
      - "scripts/codex-harness-version.mjs"
      - ".github/workflows/*.yml"

permissions:
  contents: read

jobs:
  v130-shadow-aggregate:
    name: v130-shadow-aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact checkout head
        shell: bash
        env:
          CODEX_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$CODEX_EXPECTED_HEAD_SHA" ]; then
            echo "::error title=v1.3.2 exact-head checkout mismatch::v132_workflow_checkout_head_mismatch"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - run: node scripts/codex-v132-compatibility-check.mjs --lane=immediate-secondary

  v129-shadow-aggregate:
    name: v129-shadow-aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact checkout head
        shell: bash
        env:
          CODEX_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$CODEX_EXPECTED_HEAD_SHA" ]; then
            echo "::error title=v1.3.2 exact-head checkout mismatch::v132_workflow_checkout_head_mismatch"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - run: node scripts/codex-v132-compatibility-check.mjs --lane=emergency

  aggregate-contract:
    name: aggregate contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact checkout head
        shell: bash
        env:
          CODEX_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$CODEX_EXPECTED_HEAD_SHA" ]; then
            echo "::error title=v1.3.2 exact-head checkout mismatch::v132_workflow_checkout_head_mismatch"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - run: node scripts/codex-v132-compatibility-check.mjs --lane=blocking-readable
