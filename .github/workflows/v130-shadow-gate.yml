# CODEX_QUALITY_HARNESS_FILE v1.2.9
name: v130-shadow-gate

on:
  pull_request:
    paths:
      - "CODEX_SOURCE_HARNESS_MANIFEST.json"
      - "docs/process/CODEX_V130_POLICY.json"
      - "docs/process/CODEX_V130_SCHEMA.json"
      - "docs/process/CODEX_V130_SPEC.md"
      - "scripts/codex-v130-*.mjs"
      - ".github/workflows/v130-shadow-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  v130-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: node scripts/codex-v130-self-test.mjs --stage=contracts
  v130-intake-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: node scripts/codex-v130-self-test.mjs --stage=intake-context
  v130-orchestration-autonomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: node scripts/codex-v130-self-test.mjs --stage=orchestration-autonomy
  v130-token-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: node scripts/codex-v130-self-test.mjs --stage=token-differential
  v130-adversarial-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: node scripts/codex-v130-self-test.mjs --stage=adversarial-benchmark
  v129-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: node scripts/codex-v129-self-test.mjs --stage=all
  v128-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: node scripts/codex-v128-self-test.mjs
  v127-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: node scripts/codex-v127-self-test.mjs
  v130-shadow-aggregate:
    runs-on: ubuntu-latest
    needs: [v130-contract, v130-intake-context, v130-orchestration-autonomy, v130-token-differential, v130-adversarial-benchmark, v129-compatibility, v128-compatibility, v127-compatibility]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: |
          mkdir -p v130-shadow-safe-artifacts
          CODEX_QUALITY_REPORT=json node scripts/codex-v130-self-test.mjs --stage=all > v130-shadow-safe-artifacts/v130-shadow-safe-summary.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('v130-shadow-safe-artifacts/v130-shadow-safe-summary.json','utf8')); if(r.v130SelfTestStatus.status!=='pass') process.exit(1);"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v130-shadow-safe-artifacts
          path: v130-shadow-safe-artifacts
          if-no-files-found: error
