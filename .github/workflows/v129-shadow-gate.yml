# CODEX_QUALITY_HARNESS_FILE v1.2.9
name: v129-shadow-gate

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  v129-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: node scripts/codex-v129-self-test.mjs --stage=contract
  v129-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: node scripts/codex-v129-self-test.mjs --stage=routing
  v129-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: node scripts/codex-v129-self-test.mjs --stage=verifier
  v129-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: node scripts/codex-v129-self-test.mjs --stage=negative
  v128-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: node scripts/codex-v130-self-test.mjs --stage=v128-compatibility
  v129-shadow-aggregate:
    runs-on: ubuntu-latest
    needs: [v129-contract, v129-routing, v129-verifier, v129-negative, v128-compatibility]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: |
          mkdir -p v129-shadow-safe-artifacts
          CODEX_V129_TEST_MODE=1 CODEX_V129_SHADOW=1 node scripts/codex-v129-shadow-runner.mjs --fixture > v129-shadow-safe-artifacts/v129-shadow-safe-summary.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { canonicalJson } from './scripts/codex-v129-goal-contract.mjs';
          import {
            buildV129ShadowColdArtifacts,
            validateV129ShadowColdArtifactBudgets,
          } from './scripts/codex-v129-shadow-runner.mjs';
          const summary = JSON.parse(fs.readFileSync('v129-shadow-safe-artifacts/v129-shadow-safe-summary.json', 'utf8'));
          const coldArtifacts = buildV129ShadowColdArtifacts(summary);
          const validation = validateV129ShadowColdArtifactBudgets(summary, coldArtifacts);
          if (validation.status !== 'pass') {
            console.error(canonicalJson(validation));
            process.exit(1);
          }
          fs.writeFileSync('v129-shadow-safe-artifacts/codex-orchestration-capsule.safe.json', `${canonicalJson(coldArtifacts.orchestration)}\n`);
          fs.writeFileSync('v129-shadow-safe-artifacts/codex-worker-proof.safe.json', `${canonicalJson(coldArtifacts.workerProof)}\n`);
          fs.writeFileSync('v129-shadow-safe-artifacts/codex-owner-decision-brief.safe.json', `${canonicalJson(coldArtifacts.ownerDecisionBrief)}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v129-shadow-safe-artifacts
          path: v129-shadow-safe-artifacts
          if-no-files-found: error
